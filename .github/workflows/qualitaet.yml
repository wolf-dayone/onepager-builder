name: Qualität

on:
  push:
  pull_request:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # tools/pruefen.py, tools/selbsttest.py, tools/katalog_bauen.py,
      # tools/bauen.py und tools/skill_bauen.py laufen auf der Python-Stdlib,
      # keine Abhaengigkeiten. Einzige Ausnahme: tools/qa_pruefen.py weiter
      # unten (Playwright, fuer echte Browser-Checks) - bewusster Tradeoff,
      # siehe README.md.

      - name: Katalog und Regeln sind auf dem Stand der Descriptions
        run: |
          python3 tools/katalog_bauen.py
          git diff --exit-code -- referenzen/module-katalog.md data/regeln.json \
            || { echo "::error::Katalog/Regeln sind nicht neu gebaut. tools/katalog_bauen.py laufen lassen und committen."; exit 1; }

      - name: HTML ist aus den Bausteinen gebaut
        run: |
          python3 tools/bauen.py
          git diff --exit-code -- starter.html modul-galerie.html \
            || { echo "::error::starter.html/modul-galerie.html weichen von bausteine/ ab. tools/bauen.py laufen lassen und committen."; exit 1; }

      - name: Der Prüfer findet, was er finden soll
        run: python3 tools/selbsttest.py

      - name: Seiten gegen die Figma-Regeln prüfen
        run: python3 tools/pruefen.py --keine-farbe index.html starter.html modul-galerie.html

      - name: Skill-Paket lässt sich bauen
        run: python3 tools/skill_bauen.py

      # Browserbasierte Checks (Screenshots, Overflow, Console-/Netzwerkfehler) -
      # einzige externe Abhaengigkeit im Repo, siehe tools/qa_pruefen.py. Laeuft
      # non-blocking: die Modul-Bibliothek hat bekannte, noch nicht triagierte
      # Befunde (Schritt 3/4 des Testkonzepts) - bis die abgearbeitet sind, soll
      # ein bestehender Befund nicht jeden Push rot faerben. Ergebnis liegt als
      # Artefakt bei, damit man es ohne lokales Playwright einsehen kann.
      - name: Playwright installieren
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Browser-Checks auf modul-galerie.html (Screenshots, Overflow, Konsole)
        id: qa_pruefen
        continue-on-error: true
        run: python3 tools/qa_pruefen.py

      - name: QA-Ausgabe als Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-ausgabe
          path: qa-ausgabe/
          if-no-files-found: ignore

      - name: Browser-Check-Ergebnis vermerken
        if: steps.qa_pruefen.outcome == 'failure'
        run: echo "::warning::tools/qa_pruefen.py hat Befunde gemeldet - Artefakt 'qa-ausgabe' pruefen. Blockiert den Build bewusst nicht (Schritt 3/4 des Testkonzepts steht noch aus)."
