<style>
/* ==== Device-Mockup ==== */
/* Figma: echte Geraete aus dem DAYONE Designsystem. Hier als CSS-Rahmen
   nachgebaut, damit kein Bild-Asset noetig ist. Max. 3 Devices pro Modul. */
.device-buehne{display:flex;justify-content:center;align-items:flex-end;
  gap:var(--space-10);flex-wrap:wrap;margin-top:var(--space-12)}
.device{flex:none}
.device .schirm{background:var(--color-detail);overflow:hidden;display:flex;
  align-items:center;justify-content:center;color:var(--color-text);
  font-size:var(--text-body-s)}
.device .schirm img{width:100%;height:100%;object-fit:cover}
.device.ist-laptop{width:min(720px,100%)}
/* Einheitlicher Rahmen (statt Border direkt auf dem Screen) wie ein echtes
   Unibody-Geraet: oben/seitlich duenner Steg, unten dickerer Sockel mit
   Scharnier-Kerbe - frueher wirkte der Screen-Border + freistehender Fuss
   wie zwei separate Teile statt einem Geraet (Figma-Abgleich 2026-09-17). */
.device.ist-laptop .rahmen{background:var(--color-main-text);
  border-radius:14px 14px 4px 4px;padding:12px 12px 6px}
.device.ist-laptop .schirm{aspect-ratio:16/10;border-radius:3px}
.device.ist-laptop .fuss{height:12px;background:var(--color-main-text);
  border-radius:0 0 7px 7px;position:relative}
.device.ist-laptop .fuss::after{content:"";position:absolute;left:50%;top:0;
  transform:translateX(-50%);width:14%;height:4px;background:var(--color-bg);
  border-radius:0 0 4px 4px}
.device.ist-phone{width:min(220px,100%)}
.device.ist-phone .schirm{aspect-ratio:9/19.5;border:8px solid var(--color-main-text);
  border-radius:28px}
.device.ist-tablet{width:min(420px,100%)}
.device.ist-tablet .schirm{aspect-ratio:4/3;border:10px solid var(--color-main-text);
  border-radius:18px}
.device-legende{margin-top:var(--space-8);text-align:center}
.device-legende h3{font-size:var(--text-body-l);font-weight:600;line-height:1.2;
  color:var(--color-main-text)}
.device-legende p{margin-top:6px;font-size:var(--text-body-s);line-height:1.2;
  color:var(--color-text)}
@media(max-width:900px){.device-buehne{gap:var(--space-8)}}
</style>

<!-- Situativ (2026-09-16, Ernst bestaetigt): zeigt je nach Kontext einen
     einzelnen Laptop, ein einzelnes Tablet, oder ein/mehrere Telefone -
     keine feste Kombinationspflicht. Nur wenn mehrere Telefone zusammen
     gezeigt werden, paarweise anordnen, damit die Komposition ruhig bleibt. -->
<section data-modul="07 Media/02 device-mockup">
  <div class="wrap">
    <!-- Eyebrow ist optional: nur behalten und mit echter Kapitelnummer fuellen, wenn DIESE Sektion zusaetzlich data-chapter/data-chapter-title/id traegt und damit ein neues, in der Kapitel-Nav verlinktes Kapitel markiert (siehe referenzen/module-katalog.md, Abschnitt "Eyebrow"). Sonst die Zeile komplett loeschen, nicht nur den Platzhaltertext ersetzen - ein unnumeriertes "[NN]" bleibt sonst als Platzhalter-Fehler stehen (Figma-Regel, 2026-09-16 bestaetigt). -->
    <p class="eyebrow is-centered reveal">[NN] — [Prototyp]<span class="eyebrow-linie" aria-hidden="true"></span></p>
    <!-- Beispiel: einzelner Laptop. Alternativen: <div class="device ist-tablet">
         oder ein/mehrere <div class="device ist-phone"> - je nach Kontext waehlen,
         nicht zwingend kombinieren. -->
    <div class="device-buehne reveal">
      <div class="device ist-laptop"><div class="rahmen"><div class="schirm">[Screen]</div></div><div class="fuss"></div></div>
    </div>
    <div class="device-legende reveal">
      <h3>[Prototyp im Device]</h3>
      <p>[Ein Satz, warum die Plattform Teil der Aussage ist.]</p>
    </div>
  </div>
</section>
