<style>
/* ==== Kennzahlen (dunkel) ==== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--space-6);margin-top:var(--space-10)}
/* Linie ueber .linie-oben (_basis.css): zeichnet sich synchron mit dem
   Hochkommen der Kennzahl und dem Hochzaehlen - vorher war sie fertig, bevor
   die spaeteren Kennzahlen ueberhaupt sichtbar wurden (Feedback 2026-09-17). */
.stat{padding-top:28px}
.stat .value{font-size:var(--text-display-1);font-weight:600;line-height:1}
.stat .label{margin-top:var(--space-4);font-size:var(--text-body-ms);font-weight:600}
.stat .note{margin-top:8px;font-size:var(--text-body-s);color:var(--color-text)}
</style>

<section data-chapter="[NN]" data-chapter-title="[Kapitelname]" id="kapitel-[nn]" data-modul="04 Daten/01 kennzahlen-grid">
  <div class="wrap">
    <div class="section-head">
      <div>
        <p class="eyebrow reveal">[NN] — [Bilanz]<span class="eyebrow-linie" aria-hidden="true"></span></p>
        <h2 class="h2 reveal">[Das Projekt in Zahlen]</h2>
      </div>
    </div>
    <div class="stats">
      <div class="stat linie-oben reveal"><div class="value" data-count-to="34">0</div>
        <div class="label">[Projekttage]</div><div class="note">[Kurze Einordnung.]</div></div>
      <div class="stat linie-oben reveal"><div class="value" data-count-to="21">0</div>
        <div class="label">[Tage/Jahr gespart]</div><div class="note">[Kurze Einordnung.]</div></div>
      <div class="stat linie-oben reveal"><div class="value" data-count-to="9">0</div>
        <div class="label">[Aktive Nutzer:innen]</div><div class="note">[Kurze Einordnung.]</div></div>
    </div>
  </div>
</section>
