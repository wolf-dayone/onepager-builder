<style>
/* ==== Kennzahlen (dunkel) ==== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--space-6);margin-top:var(--space-10)}
.stat{position:relative;padding-top:28px}
.stat::before{content:"";position:absolute;top:0;left:0;width:100%;height:1px;background:var(--color-border);
  transform:scaleX(0);transform-origin:left;transition:transform .8s var(--ease) .2s}
.stat.in::before{transform:scaleX(1)}
@media(prefers-reduced-motion:reduce){.stat::before{transform:scaleX(1);transition:none}}
.stat .value{font-size:var(--text-display-1);font-weight:600;line-height:1}
.stat .label{margin-top:var(--space-4);font-size:var(--text-body-ms);font-weight:600}
.stat .note{margin-top:8px;font-size:var(--text-body-s);color:var(--color-text)}
</style>

<section data-chapter="[NN]" data-chapter-title="[Kapitelname]" id="kapitel-[nn]" data-modul="04 Daten/01 kennzahlen-grid">

    <div class="section-head">

        <h2 class="h2 reveal">[Das Projekt in Zahlen]</h2>
      </div>
    </div>
    <div class="stats">

</section>
