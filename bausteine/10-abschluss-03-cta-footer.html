<style>
/* ==== CTA-Footer ==== */
.cta .actions{display:flex;flex-wrap:wrap;gap:var(--space-4);margin-top:var(--space-8)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 20px;border-radius:4px;
  font-weight:600;font-size:var(--text-body-ms);text-decoration:none;min-height:44px;font-family:inherit}
.btn-primary{background:var(--color-main-text);color:var(--color-inverse-text)}
.btn-primary:hover{background:var(--color-inverse-hover)}
.btn-secondary{border:1px solid var(--color-main-text);color:var(--color-main-text)}
.btn-secondary:hover{background:var(--color-hover-tint)}
.cta .footer-row{display:flex;gap:var(--space-4);align-items:center;margin-top:var(--space-20);
  font-size:var(--text-body-s);color:var(--color-text)}
@media(max-width:700px){.btn{width:100%;justify-content:center}}
</style>

<footer class="cta" data-modul="10 Abschluss/03 cta-footer">
  <div class="wrap">
    <h2 class="h2 reveal">[Check it out.]</h2>
    <p class="lead reveal" style="margin-top:var(--space-4)">[Ein Satz Aufforderung.]</p>
    <div class="actions reveal">
      <a class="btn btn-primary" href="[URL]">[Zum Tool] <span aria-hidden="true">→</span></a>
      <a class="btn btn-secondary" href="[URL]">[Feedback] <span aria-hidden="true">→</span></a>
    </div>
    <div class="footer-row reveal">
      <svg class="logo-mark" width="92" height="16" aria-label="DAYONE"><use href="#dayone-logo"></use></svg>
      <span>© 2026 DAYONE</span>
    </div>
  </div>
</footer>
