<style>
/* ==== Roadmap-Timeline ==== */
/* Figma (node 9-9): Datum ueber der Linie, Meilenstein darunter, die Strecke
   bis zum aktuellen Punkt rot ausgefahren, der Ausblick dahinter gestrichelt
   und ausgegraut. Der aktuelle Punkt pulsiert dauerhaft.
   Geometrie der Liniensegmente rechnet _basis.js (Abschnitt 7) aus den echten
   Dot-Positionen - dadurch stimmt sie bei 3 wie bei 6 Meilensteinen und nach
   jedem Resize, ohne dass hier eine Anzahl hart verdrahtet ist. */
.timeline{position:relative;display:flex;align-items:stretch;
  --tl-datum-hoehe:28px; --tl-dot:14px}
.timeline-item{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;
  text-align:center;padding-inline:var(--space-2)}

/* Zeile 1: Datum. Feste Hoehe, damit alle Punkte exakt auf einer Linie sitzen. */
.timeline-datum{height:var(--tl-datum-hoehe);display:flex;align-items:center;
  font-size:var(--text-body-s);font-weight:600;color:var(--color-text);white-space:nowrap}
/* Zeile 2: der Punkt. */
.timeline-dot{width:var(--tl-dot);height:var(--tl-dot);border-radius:50%;
  background:var(--color-action);position:relative;z-index:1;flex:none;
  transform:scale(0);
  /* leichtes Ueberschwingen: der Punkt "setzt sich", statt nur aufzutauchen */
  transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.timeline-dot.ist-da{transform:scale(1)}
/* Ausblick: noch nicht erreichte Meilensteine sind gedeckelt grau, nicht rot. */
.timeline-item.ist-ausblick .timeline-dot{background:var(--color-muted)}
.timeline-item.ist-ausblick .timeline-titel{color:var(--color-text)}

/* Dauerpuls am aktuellen Punkt: zwei versetzte Ringe, die nach aussen laufen
   und ausblenden - laeuft in Schleife weiter, das ist der einzige Teil der
   Seite, der nicht zur Ruhe kommt (Figma: "AKTUELL"). */
.timeline-dot.ist-aktuell::before,.timeline-dot.ist-aktuell::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  border:1px solid var(--color-action);opacity:0}
.timeline-dot.ist-aktuell.ist-da::before,.timeline-dot.ist-aktuell.ist-da::after{
  animation:tl-puls 2.6s var(--ease-reveal) infinite}
.timeline-dot.ist-aktuell.ist-da::after{animation-delay:1.3s}
@keyframes tl-puls{
  0%  {transform:scale(1);   opacity:.9}
  70% {transform:scale(3.2); opacity:0}
  100%{transform:scale(3.2); opacity:0}
}

/* Zeile 3: Meilenstein + optionales Badge. */
.timeline-titel{margin-top:14px;font-size:var(--text-body-ms);font-weight:600;
  line-height:1.3;color:var(--color-main-text)}
.timeline-badge{margin-top:10px;align-self:center;background:var(--color-action);
  color:var(--gray-50);border-radius:var(--radius-pill);padding:4px 12px;
  font-size:var(--text-body-s);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
/* Datum, Titel und Badge kommen erst, wenn ihr Punkt steht - gesetzt per JS
   ueber .ist-beschriftet auf dem Item. */
.timeline-datum,.timeline-titel,.timeline-badge{opacity:0;transform:translateY(8px);
  transition:opacity .5s var(--ease-reveal),transform .5s var(--ease-reveal)}
.timeline-item.ist-beschriftet .timeline-datum,
.timeline-item.ist-beschriftet .timeline-titel,
.timeline-item.ist-beschriftet .timeline-badge{opacity:1;transform:none}
.timeline-item.ist-beschriftet .timeline-titel{transition-delay:.08s}
.timeline-item.ist-beschriftet .timeline-badge{transition-delay:.16s}

/* Linienebene: liegt genau auf Punkt-Mitte, Segmente bekommen left/width per JS.
   Die Breite (nicht scaleX) wird animiert, damit die Striche des gestrichelten
   Ausblicks beim Wachsen ihre Laenge behalten. */
.timeline-linien{position:absolute;left:0;right:0;
  top:calc(var(--tl-datum-hoehe) + var(--tl-dot) / 2);height:1px;pointer-events:none}
.timeline-seg{position:absolute;top:0;height:1px;width:0;
  background:var(--color-action);
  transition:width var(--dur-lang) var(--ease-linie)}
/* Ausblick-Strecke: gestrichelt und grau statt durchgezogen rot. */
.timeline-seg.ist-ausblick{background:none;color:var(--color-muted);
  background-image:repeating-linear-gradient(90deg,currentColor 0 6px,transparent 6px 12px)}

@media(prefers-reduced-motion:reduce){
  .timeline-dot{transform:scale(1);transition:none}
  .timeline-dot.ist-aktuell.ist-da::before,.timeline-dot.ist-aktuell.ist-da::after{animation:none}
  .timeline-datum,.timeline-titel,.timeline-badge{opacity:1;transform:none;transition:none}
  .timeline-seg{transition:none}
}
/* Mobile: senkrecht gestapelt. Die Segment-Geometrie (waagerecht gerechnet)
   greift dort nicht - _basis.js erkennt das und zeigt alles direkt an. */
@media(max-width:900px){
  .timeline{flex-direction:column;gap:var(--space-8);align-items:flex-start}
  .timeline-item{flex-direction:row;align-items:center;gap:var(--space-4);
    text-align:left;width:100%}
  .timeline-datum{height:auto}
  .timeline-titel{margin-top:0}
  .timeline-linien{display:none}
}
</style>

<!-- 3-6 Meilensteine. Genau EINER traegt .ist-aktuell (der pulsierende, rote
     Punkt). Meilensteine, die noch bevorstehen, bekommen .ist-ausblick - die
     Strecke dorthin wird dann gestrichelt und grau gezeichnet. -->
<section data-chapter="[NN]" data-chapter-title="[Kapitelname]" id="kapitel-[nn]" data-modul="06 Zeitachse/01 roadmap-timeline">
  <div class="wrap">
    <p class="eyebrow is-centered reveal">[NN] — [Timeline]<span class="eyebrow-linie" aria-hidden="true"></span></p>
    <h2 class="h2 reveal" style="margin-bottom:var(--space-20);text-align:center">[Von wo bis wo?]</h2>
    <div class="timeline">
      <div class="timeline-linien" aria-hidden="true"></div>
      <div class="timeline-item">
        <span class="timeline-datum">[Zeitpunkt 1]</span>
        <span class="timeline-dot"></span>
        <span class="timeline-titel">[Meilenstein 1]</span>
      </div>
      <div class="timeline-item">
        <span class="timeline-datum">[Zeitpunkt 2]</span>
        <span class="timeline-dot"></span>
        <span class="timeline-titel">[Meilenstein 2]</span>
      </div>
      <div class="timeline-item ist-aktuell">
        <span class="timeline-datum">[Zeitpunkt 3]</span>
        <span class="timeline-dot"></span>
        <span class="timeline-titel">[Meilenstein 3]</span>
        <span class="timeline-badge">Aktuell</span>
      </div>
      <div class="timeline-item ist-ausblick">
        <span class="timeline-datum">[Zeitpunkt 4]</span>
        <span class="timeline-dot"></span>
        <span class="timeline-titel">[Meilenstein 4]</span>
      </div>
    </div>
  </div>
</section>
