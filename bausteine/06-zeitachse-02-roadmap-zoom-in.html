<style>
/* ==== Roadmap Zoom-In (Gantt) ==== */
/* Figma (node 33-3): Monatsraster ueber der gesamten Kartenbreite, darunter
   eine Trennlinie, dann die Phasenbalken mit ihrer Nummer IM Balken. Rechts
   die Meilensteinliste, deren hervorgehobener Eintrag als Karte liegt.
   Balken werden ueber --von und --bis (Spalten im Raster) positioniert. */
.roadmap-zoom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);
  gap:var(--space-16);align-items:start}
.gantt{margin-top:var(--space-6);display:flex;flex-direction:column;gap:12px;
  padding:var(--space-8);border-radius:var(--radius-card);background:var(--color-detail)}
.gantt-kopf{display:grid;grid-template-columns:repeat(var(--spalten,12),1fr);gap:4px;
  padding-bottom:var(--space-4);border-bottom:1px solid var(--color-border);
  margin-bottom:var(--space-4);
  font-size:var(--text-body-s);color:var(--color-text);text-align:center}
.gantt-zeile{display:grid;grid-template-columns:repeat(var(--spalten,12),1fr);gap:4px;
  align-items:center}
/* Balken: Nummer sitzt im Balken (Figma), Flaeche in der Icon-Rolle statt in
   einer Linien-/Textrolle - dieselbe Stufung wie beim Chart-Slide. */
.gantt-balken{grid-column:var(--von) / calc(var(--bis) + 1);height:40px;border-radius:6px;
  background:var(--color-icon-tertiary);display:flex;align-items:center;padding-inline:14px;
  font-size:var(--text-body-s);font-weight:600;color:var(--color-main-text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  cursor:pointer;appearance:none;border:0;font-family:inherit;text-align:left;
  /* Balken fahren beim Reveal aus ihrem linken Rand aus (siehe _basis.js) */
  transform:scaleX(0);transform-origin:left;
  transition:transform var(--dur-linie) var(--ease-linie),
             background var(--dur-ui) var(--ease-ui),color var(--dur-ui) var(--ease-ui)}
.gantt-balken.ist-da{transform:scaleX(1)}
/* Die Nummer darf die Balken-Skalierung nicht mitmachen, sonst wird sie
   waehrend des Ausfahrens gestaucht. */
.gantt-balken .nummer{display:inline-block;transform:scaleX(var(--gegen,1));
  transform-origin:left}
/* Dunkel-Hervorhebung ist ein HOVER-Zustand, keine feste Anfangsauswahl
   (Feedback 2026-09-17) - Figma zeigt in der Referenz genau diesen Zustand.
   Hover/Fokus hebt zusaetzlich den passenden Meilenstein rechts hervor
   (siehe _basis.js "Roadmap Zoom-In"). */
.gantt-balken:hover,.gantt-balken:focus-visible,.gantt-balken.ist-betont{
  background:var(--color-icon-secondary);color:var(--color-inverse-text)}
.zoom-liste{margin:0;display:flex;flex-direction:column;gap:var(--space-2)}
.zoom-meilenstein{display:flex;gap:var(--space-4);padding:var(--space-4) var(--space-6);
  border-radius:var(--radius-card);
  transition:background var(--dur-ui) var(--ease-ui)}
.zoom-nummer{flex:none;width:28px;font-size:var(--text-body-s);font-weight:600;
  color:var(--color-muted);transition:color var(--dur-ui) var(--ease-ui)}
.zoom-meilenstein dt{font-size:var(--text-body-ms);font-weight:600;color:var(--color-main-text)}
.zoom-meilenstein dd{margin:6px 0 0;font-size:var(--text-body-s);color:var(--color-text);
  line-height:1.3}
.zoom-meilenstein.ist-hervorgehoben{background:var(--color-detail)}
.zoom-meilenstein.ist-hervorgehoben .zoom-nummer{color:var(--color-main-text)}
@media(prefers-reduced-motion:reduce){.gantt-balken{transform:none;transition:none}}
/* Figma: bricht auf Mobile schnell - dort als vertikale Liste. */
@media(max-width:900px){
  .roadmap-zoom{grid-template-columns:1fr;gap:var(--space-10)}
  .gantt-zeile{grid-template-columns:1fr}
  .gantt-kopf{display:none}
  .gantt-balken{grid-column:1 / -1}
}
</style>

<!-- Max. 6 Arbeitspakete. Jeder Balken traegt data-verweis="N" und zeigt damit
     auf den Meilenstein mit demselben data-verweis. -->
<section data-chapter="[NN]" data-chapter-title="[Kapitelname]" id="kapitel-[nn]" data-modul="06 Zeitachse/02 roadmap-zoom-in">
  <div class="wrap roadmap-zoom">
    <div>
      <p class="eyebrow reveal">[NN] — [Planung]<span class="eyebrow-linie" aria-hidden="true"></span></p>
      <h2 class="h2 reveal">[Wie die Phasen liegen]</h2>
      <div class="gantt reveal ist-nur-opacity" style="--spalten:12">
        <div class="gantt-kopf">
          <span>[Jan]</span><span>[Feb]</span><span>[Mär]</span><span>[Apr]</span>
          <span>[Mai]</span><span>[Jun]</span><span>[Jul]</span><span>[Aug]</span>
          <span>[Sep]</span><span>[Okt]</span><span>[Nov]</span><span>[Dez]</span>
        </div>
        <div class="gantt-zeile"><button type="button" class="gantt-balken" data-verweis="1" style="--von:3;--bis:5"><span class="nummer">01</span></button></div>
        <div class="gantt-zeile"><button type="button" class="gantt-balken" data-verweis="2" style="--von:4;--bis:7"><span class="nummer">02</span></button></div>
        <div class="gantt-zeile"><button type="button" class="gantt-balken" data-verweis="3" style="--von:5;--bis:9"><span class="nummer">03</span></button></div>
      </div>
    </div>
    <dl class="zoom-liste">
      <p class="lead reveal" style="margin-bottom:var(--space-4)">[Meilensteine]</p>
      <div class="zoom-meilenstein reveal" data-verweis="1"><span class="zoom-nummer">01</span>
        <div><dt>[Meilenstein 1]</dt><dd>[Was in dieser Phase erreicht wird.]</dd></div></div>
      <div class="zoom-meilenstein reveal" data-verweis="2"><span class="zoom-nummer">02</span>
        <div><dt>[Meilenstein 2]</dt><dd>[Was in dieser Phase erreicht wird.]</dd></div></div>
      <div class="zoom-meilenstein reveal" data-verweis="3"><span class="zoom-nummer">03</span>
        <div><dt>[Meilenstein 3]</dt><dd>[Was in dieser Phase erreicht wird.]</dd></div></div>
    </dl>
  </div>
</section>
