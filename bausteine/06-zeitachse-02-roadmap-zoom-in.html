<style>
/* ==== Roadmap Zoom-In (Gantt) ==== */
/* Detailplanung: Phasenbalken ueber eine Zeitachse. Balken werden ueber
   --von und --bis (Spalten im Raster) positioniert. Max. 6 Arbeitspakete. */
.roadmap-zoom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:var(--space-16);align-items:start}
.gantt{margin-top:var(--space-6);display:flex;flex-direction:column;gap:10px;
  padding:var(--space-6);border-radius:var(--radius-card);background:var(--color-detail)}
.gantt-kopf{display:grid;grid-template-columns:repeat(var(--spalten,6),1fr);gap:4px;
  font-size:var(--text-body-s);color:var(--color-text)}
.gantt-zeile{display:grid;grid-template-columns:repeat(var(--spalten,6),1fr);gap:4px;
  align-items:center}
.gantt-balken{grid-column:var(--von) / calc(var(--bis) + 1);height:28px;border-radius:4px;
  background:var(--color-border);display:flex;align-items:center;padding-inline:10px;
  font-size:var(--text-body-s);color:var(--color-main-text);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;cursor:pointer;appearance:none;border:0;
  font-family:inherit;text-align:left;
  transition:background .2s var(--ease),color .2s var(--ease)}
/* Dunkel-Hervorhebung ist ein HOVER-Zustand, keine feste Anfangsauswahl mehr -
   frueher stand ein Balken/Meilenstein per .ist-aktuell fest dunkel, obwohl das
   in Figma nur der Hover/Active-Zustand ist (Video-Feedback 2026-09-17). Hover
   bzw. Fokus auf einem Balken hebt den passenden Meilenstein rechts hervor
   (siehe _basis.js "Roadmap Zoom-In"), per Touch uebernimmt ein kurzer
   "betont"-Zustand dieselbe Klasse. */
.gantt-balken:hover,.gantt-balken:focus-visible,.gantt-balken.ist-betont{
  background:var(--color-main-text);color:var(--color-inverse-text)}
.zoom-meilenstein{display:flex;gap:var(--space-4);padding:var(--space-4);
  border-top:1px solid var(--color-border);border-radius:var(--radius-card);
  transition:background .2s var(--ease),border-color .2s var(--ease)}
.zoom-nummer{flex:none;width:24px;font-size:var(--text-body-s);font-weight:600;
  color:var(--color-border)}
.zoom-meilenstein dt{font-size:var(--text-body-s);color:var(--color-main-text)}
.zoom-meilenstein dd{margin:4px 0 0;font-size:var(--text-body-s);color:var(--color-text);
  line-height:1.2}
.zoom-meilenstein.ist-hervorgehoben{background:var(--color-detail);
  border-top-color:transparent;padding:var(--space-6)}
.zoom-meilenstein.ist-hervorgehoben .zoom-nummer{color:var(--color-main-text)}
/* Figma: bricht auf Mobile schnell - dort als vertikale Liste. */
@media(max-width:900px){
  .roadmap-zoom{grid-template-columns:1fr;gap:var(--space-10)}
  .gantt-zeile{grid-template-columns:1fr}
  .gantt-kopf{display:none}
  .gantt-balken{grid-column:1 / -1}
}
</style>

<section data-chapter="[NN]" data-chapter-title="[Kapitelname]" id="kapitel-[nn]" data-modul="06 Zeitachse/02 roadmap-zoom-in">
  <div class="wrap roadmap-zoom">
    <div>
      <p class="eyebrow reveal">[NN] — [Planung]<span class="eyebrow-linie" aria-hidden="true"></span></p>
      <h2 class="h2 reveal">[Wie die Phasen liegen]</h2>
      <div class="gantt" style="--spalten:6">
        <div class="gantt-kopf">
          <span>[Q1]</span><span>[Q2]</span><span>[Q3]</span><span>[Q4]</span><span>[Q1]</span><span>[Q2]</span>
        </div>
        <div class="gantt-zeile"><button type="button" class="gantt-balken" data-verweis="1" style="--von:1;--bis:2">[Arbeitspaket 1]</button></div>
        <div class="gantt-zeile"><button type="button" class="gantt-balken" data-verweis="2" style="--von:2;--bis:4">[Arbeitspaket 2]</button></div>
        <div class="gantt-zeile"><button type="button" class="gantt-balken" data-verweis="3" style="--von:4;--bis:6">[Arbeitspaket 3]</button></div>
      </div>
    </div>
    <dl style="margin:0">
      <p class="lead reveal" style="margin-bottom:var(--space-4)">[Meilensteine]</p>
      <div class="zoom-meilenstein reveal" data-verweis="1"><span class="zoom-nummer">01</span>
        <div><dt>[Meilenstein 1]</dt><dd>[Was in dieser Phase erreicht wird.]</dd></div></div>
      <div class="zoom-meilenstein reveal" data-verweis="2"><span class="zoom-nummer">02</span>
        <div><dt>[Meilenstein 2]</dt><dd>[Was in dieser Phase erreicht wird.]</dd></div></div>
      <div class="zoom-meilenstein reveal" data-verweis="3"><span class="zoom-nummer">03</span>
        <div><dt>[Meilenstein 3]</dt><dd>[Was in dieser Phase erreicht wird.]</dd></div></div>
    </dl>
  </div>
</section>
