<style>
/* ==== Logo-Wand ==== */
/* Figma: Logos optisch auf gleiche HOEHE bringen, nicht auf gleiche Breite -
   deshalb begrenzt der Slot die Hoehe und laesst die Breite laufen. */
/* Eigener Hintergrund statt des geteilten --color-bg: Figma will hier explizit
   Schwarz im Dunkelmodus (nicht das warme Dunkel-Sand aller anderen Sektionen)
   und Sand im Hellmodus - Video-Feedback 2026-09-17 ("Hintergrundfarbe ist
   falsch, sollte im Dark Mode schwarz und im Light Mode sand sein"). */
[data-modul="09 Referenzen/01 logo-wand"]{background:var(--color-bg)}
.dark [data-modul="09 Referenzen/01 logo-wand"],[data-modul="09 Referenzen/01 logo-wand"].dark{
  background:var(--color-dark-bg)}
.logo-wand{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--space-6);
  margin-top:var(--space-12)}
.logo-slot{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  padding:var(--space-6);font-size:var(--text-body-s);color:var(--color-text)}
.logo-slot img{max-height:44px;width:auto;max-width:100%;object-fit:contain;
  filter:grayscale(1);opacity:.85}
@media(max-width:900px){.logo-wand{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
