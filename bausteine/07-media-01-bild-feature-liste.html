<style>
/* ==== Bild + Feature-Liste ==== */
.bild-feature{display:grid;grid-template-columns:760px minmax(0,1fr);gap:var(--space-16);
  align-items:center}
.bild-feature-bild{aspect-ratio:760/480;border-radius:var(--radius-card);overflow:hidden;
  background:var(--color-detail);display:flex;align-items:center;justify-content:center;
  color:var(--color-text);font-size:var(--text-body-s)}
.bild-feature-bild img{width:100%;height:100%;object-fit:cover}
.bild-feature-version{font-size:var(--text-body-s);line-height:1.2;color:var(--color-text)}
.bild-feature-titel{margin-top:var(--space-4);font-size:var(--text-body-l);font-weight:600;
  line-height:1.2;color:var(--color-main-text)}
.bild-feature-punkte{list-style:none;padding:0;margin:var(--space-4) 0 0;
  display:flex;flex-direction:column;gap:var(--space-4)}
.bild-feature-punkt{display:flex;gap:12px;font-size:var(--text-body-s);line-height:1.2;
  color:var(--color-text)}
@media(max-width:1200px){.bild-feature{grid-template-columns:minmax(0,1fr) 320px}}
@media(max-width:900px){.bild-feature{grid-template-columns:1fr;gap:var(--space-8)}}
</style>

<!-- Screenshot in echter Aufloesung. Sensible Daten vorher anonymisieren. -->
<section data-chapter="[NN]" data-chapter-title="[Kapitelname]" id="kapitel-[nn]" data-modul="07 Media/01 bild-feature-liste">
  <div class="wrap">
    <p class="eyebrow">[NN] — [Ergebnis]</p>
    <div class="bild-feature" style="margin-top:var(--space-12)">
      <div class="bild-feature-bild reveal">[Screenshot]</div>
      <div class="reveal">
        <p class="bild-feature-version">[VERSION 1.0]</p>
        <h3 class="bild-feature-titel">[Feature-Name]</h3>
        <ul class="bild-feature-punkte">
          <li class="bild-feature-punkt"><span aria-hidden="true">→</span><span>[Erste Kernfunktion]</span></li>
          <li class="bild-feature-punkt"><span aria-hidden="true">→</span><span>[Zweite Kernfunktion]</span></li>
          <li class="bild-feature-punkt"><span aria-hidden="true">→</span><span>[Dritte Kernfunktion]</span></li>
          <li class="bild-feature-punkt"><span aria-hidden="true">→</span><span>[Export- oder Filtermöglichkeit]</span></li>
        </ul>
      </div>
    </div>
  </div>
</section>
