<style>
/* ==== Medien-Karten-Grid ==== */
.medien-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-8);
  margin-top:var(--space-10)}
.medien-grid.ist-dreispaltig{grid-template-columns:repeat(3,minmax(0,1fr))}
.medien-karte{display:flex;flex-direction:column;border:1px solid var(--color-border);
  border-radius:var(--radius-card);overflow:hidden;text-decoration:none;color:inherit;
  transition:border-color .2s var(--ease)}
a.medien-karte:hover{border-color:var(--color-main-text)}
.medien-karte .bild{aspect-ratio:16/9;background:var(--color-detail);display:flex;
  align-items:center;justify-content:center;color:var(--color-text);
  font-size:var(--text-body-s)}
.medien-karte .bild img{width:100%;height:100%;object-fit:cover}
/* Beschriftete Kachel: wenn zu einem verlinkten Prototyp kein Screenshot
   vorliegt. Sagt ehrlich, was dahinter wartet, statt ein Bild zu erfinden,
   das aussieht wie das Produkt, aber keines ist. */
.medien-karte .bild.ist-beschriftet{flex-direction:column;gap:6px;text-align:center;
  padding:var(--space-6)}
.medien-karte .bild.ist-beschriftet .ziel{font-size:var(--text-body-ms);font-weight:600;
  color:var(--color-main-text)}
.medien-karte .bild.ist-beschriftet .domain{font-size:var(--text-body-s);
  color:var(--color-text)}
.medien-karte .text{padding:var(--space-5) var(--space-6) var(--space-6)}
.medien-karte h3{font-size:var(--text-body-m);font-weight:400;line-height:1.3;
  color:var(--color-main-text)}
.medien-karte p{margin-top:6px;font-size:var(--text-body-s);line-height:1.2;
  color:var(--color-text)}
@media(max-width:900px){
  .medien-grid,.medien-grid.ist-dreispaltig{grid-template-columns:1fr}
}
</style>

<!-- Bei CTA-Nutzung die ganze Kachel verlinken, nicht nur den Titel. -->
<section data-chapter="[NN]" data-chapter-title="[Kapitelname]" id="kapitel-[nn]" data-modul="07 Media/03 medien-karten-grid">
  <div class="wrap">
    <p class="eyebrow">[NN] — [Weiterführend]</p>
    <h2 class="h2 reveal">[Prototypen entdecken]</h2>
    <div class="medien-grid">
      <a class="medien-karte reveal" href="[URL]">
        <div class="bild">[Bild]</div>
        <div class="text"><h3>[Ziel der Kachel]</h3><p>[Was hinter dem Klick wartet.]</p></div>
      </a>
      <!-- Ohne Screenshot: beschriftete Kachel statt erfundenem Vorschaubild. -->
      <a class="medien-karte reveal" href="[URL]">
        <div class="bild ist-beschriftet">
          <span class="ziel">[Name des Prototyps]</span>
          <span class="domain">[figma.com/proto/…]</span>
        </div>
        <div class="text"><h3>[Ziel der Kachel]</h3><p>[Was hinter dem Klick wartet.]</p></div>
      </a>
    </div>
  </div>
</section>
