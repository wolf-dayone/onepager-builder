<style>
/* ==== Big Statement ==== */
/* Ein Gedanke, ganze Flaeche. Textbreite bewusst auf 10 von 12 Spalten
   begrenzt (824px) - breiter leidet die Lesbarkeit (Figma, big-statement). */
.big-statement{text-align:center}
.big-statement .claim{font-size:var(--text-body-xl);font-weight:600;line-height:1.2;
  max-width:824px;margin-inline:auto;color:var(--color-main-text)}
</style>

<!-- Ohne Namensnennung. Mit Name + Rolle stattdessen quote-block nehmen. -->
<section class="big-statement" data-modul="02 Struktur/02 big-statement">
  <div class="wrap">
    <!-- Eyebrow ist optional: nur behalten und mit echter Kapitelnummer fuellen, wenn DIESE Sektion zusaetzlich data-chapter/data-chapter-title/id traegt und damit ein neues, in der Kapitel-Nav verlinktes Kapitel markiert (siehe referenzen/module-katalog.md, Abschnitt "Eyebrow"). Sonst die Zeile komplett loeschen, nicht nur den Platzhaltertext ersetzen - ein unnumeriertes "[NN]" bleibt sonst als Platzhalter-Fehler stehen (Figma-Regel, 2026-09-16 bestaetigt). -->
    <p class="eyebrow is-centered reveal">[NN] — [Kapitelname]<span class="eyebrow-linie" aria-hidden="true"></span></p>
    <p class="claim reveal">[Ein Satz, max. zwei Zeilen. Stecken zwei Gedanken drin: zwei Module.]</p>
  </div>
</section>
