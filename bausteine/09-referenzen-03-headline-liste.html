<style>
/* ==== Headline + Liste ==== */
.headline-liste{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-20);
  align-items:center}
.headline-liste .ziele{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;
  gap:var(--space-4)}
.headline-liste .ziel{display:flex;gap:12px;font-size:var(--text-body-m);line-height:1.3;
  color:var(--color-main-text)}
@media(max-width:900px){.headline-liste{grid-template-columns:1fr;gap:var(--space-8)}}
</style>

<!-- Folgt meist direkt auf den Case-Study-Divider. Ziele als Ergebnis formulieren. -->
<section data-modul="09 Referenzen/03 headline-liste">
  <div class="wrap headline-liste">
    <div>
      <!-- Eyebrow ist optional: nur behalten und mit echter Kapitelnummer fuellen, wenn DIESE Sektion zusaetzlich data-chapter/data-chapter-title/id traegt und damit ein neues, in der Kapitel-Nav verlinktes Kapitel markiert (siehe referenzen/module-katalog.md, Abschnitt "Eyebrow"). Sonst die Zeile komplett loeschen, nicht nur den Platzhaltertext ersetzen - ein unnumeriertes "[NN]" bleibt sonst als Platzhalter-Fehler stehen (Figma-Regel, 2026-09-16 bestaetigt). -->
      <!-- "CASE STUDY" stand hier frueher zusaetzlich als eigene Zeile - auf
           Wunsch von Ernst (2026-09-16) entfernt/auf die Eyebrow verlagert,
           die die Info bereits traegt ("... — Case Study"), um Dopplung zu
           vermeiden. -->
      <p class="eyebrow reveal">[NN] — [Case Study]<span class="eyebrow-linie" aria-hidden="true"></span></p>
      <h2 class="h2 reveal">[Kundenname]</h2>
    </div>
    <ul class="ziele reveal">
      <li class="ziel"><span aria-hidden="true">→</span><span>[Erstes Ziel als Ergebnis formuliert]</span></li>
      <li class="ziel"><span aria-hidden="true">→</span><span>[Zweites Ziel als Ergebnis formuliert]</span></li>
      <li class="ziel"><span aria-hidden="true">→</span><span>[Drittes Ziel als Ergebnis formuliert]</span></li>
    </ul>
  </div>
</section>
