<style>
/* ==== Fluss-Diagramm ==== */
/* Figma-Ueberarbeitung 2026-09-17: die Stationen sind nicht mehr alle gleich
   gefuellt, sondern tragen den Weg selbst - Eingang aussen (nur Kontur),
   Verarbeitung gefuellt, Ziel gefuellt mit kraeftiger Kontur. Dadurch sieht
   man die Richtung schon am Stillstand, nicht erst am Pfeil. */
.fluss-diagramm{display:flex;align-items:stretch;gap:var(--space-6);margin-top:var(--space-12)}
/* Eigene, etwas langsamere und weichere Einblendkurve fuer dieses Modul
   (Feedback: "koennte smoother und etwas langsamer sein") - .reveal nutzt
   sonst --ease-reveal (schneller Start, langes Ausrollen), was bei reiner
   Opacity (kein Ortswechsel, siehe .ist-nur-opacity) eher wie ein Sprung
   wirkt. Hier stattdessen die gleichmaessige Standard-Kurve, laenger. */
.fluss-diagramm .reveal.ist-nur-opacity{transition:opacity 1.4s var(--ease)}
@media(prefers-reduced-motion:reduce){
  .fluss-diagramm .reveal.ist-nur-opacity{transition:none}
}
.fluss-station{flex:1;min-height:120px;border-radius:var(--radius-card);
  border:1px solid var(--color-border);background:transparent;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;padding:var(--space-6);text-align:center}
/* Zwischenstationen: gefuellte Flaeche (Figma "presentation/card"), keine Kontur. */
.fluss-station.ist-gefuellt{background:var(--color-detail);border-color:transparent}
/* Endstation: gefuellt UND klar umrandet - der Punkt, auf den alles zulaeuft. */
.fluss-station.ist-ziel{background:var(--color-detail);border-color:var(--color-main-text)}
.fluss-station .name{font-size:var(--text-body-m);font-weight:600;line-height:1.3;color:var(--color-main-text)}
.fluss-station .art{font-size:var(--text-body-s);line-height:1.2;color:var(--color-text)}
.fluss-pfeil{flex:none;align-self:center;font-size:var(--text-body-m);color:var(--color-main-text)}
@media(max-width:900px){
  .fluss-diagramm{flex-direction:column;align-items:stretch}
  .fluss-pfeil{align-self:center;transform:rotate(90deg)}
}
</style>

<!-- 3-5 Stationen, Pfeilrichtung konsequent links nach rechts.
     Erste Station .ist-gefuellt WEGLASSEN (nur Kontur), letzte .ist-ziel,
     alles dazwischen .ist-gefuellt. -->
<!-- Reveal: Stationen und Pfeile erscheinen einzeln von links nach rechts
     (auf Mobile von oben nach unten - dieselbe DOM-Reihenfolge) und
     ausschliesslich per Opacity, ohne Versatz (Feedback 2026-09-17). Eine
     Flussrichtung, die sich beim Erscheinen selbst noch bewegt, liest sich
     doppelt; der Takt allein traegt die Richtung schon. -->
<section data-chapter="[NN]" data-chapter-title="[Kapitelname]" id="kapitel-[nn]" data-stagger="220" data-modul="04 Daten/04 fluss-diagramm">
  <div class="wrap">
    <p class="eyebrow reveal">[NN] — [Architektur]<span class="eyebrow-linie" aria-hidden="true"></span></p>
    <h2 class="h2 reveal">[Was fließt von wo nach wo]</h2>
    <div class="fluss-diagramm">
      <div class="fluss-station reveal ist-nur-opacity"><span class="name">[Quelle]</span><span class="art">[Information]</span></div>
      <span class="fluss-pfeil reveal ist-nur-opacity" aria-hidden="true">→</span>
      <div class="fluss-station ist-gefuellt reveal ist-nur-opacity"><span class="name">[Verarbeitung]</span><span class="art">[System]</span></div>
      <span class="fluss-pfeil reveal ist-nur-opacity" aria-hidden="true">→</span>
      <div class="fluss-station ist-gefuellt reveal ist-nur-opacity"><span class="name">[Prüfung]</span><span class="art">[Dienst]</span></div>
      <span class="fluss-pfeil reveal ist-nur-opacity" aria-hidden="true">→</span>
      <div class="fluss-station ist-ziel reveal ist-nur-opacity"><span class="name">[Ziel]</span><span class="art">[Output]</span></div>
    </div>
  </div>
</section>
