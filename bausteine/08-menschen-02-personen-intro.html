<style>
/* ==== Personen-Intro ==== */
.personen-intro{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:var(--space-16);
  align-items:center;max-width:1036px;margin-inline:auto}
.personen-portrait{aspect-ratio:1;border-radius:var(--radius-card);overflow:hidden;
  background:var(--color-detail);display:flex;align-items:center;justify-content:center;
  color:var(--color-text);font-size:var(--text-body-s)}
.personen-portrait img{width:100%;height:100%;object-fit:cover}
.personen-intro .person-name{margin-top:var(--space-4);font-size:var(--text-body-m);
  line-height:1.3;color:var(--color-main-text)}
.personen-intro .person-rolle{margin-top:4px;font-size:var(--text-body-s);line-height:1.2;
  color:var(--color-text)}
@media(max-width:900px){.personen-intro{grid-template-columns:1fr;gap:var(--space-8)}}
</style>

<!-- Eine Person. Ab zwei Personen team-grid verwenden. -->
<section data-modul="08 Menschen/02 personen-intro">
  <div class="wrap personen-intro">
    <div class="reveal">
      <p class="eyebrow">[NN] — [Vorstellung]</p>
      <h2 class="h2">[Hi, ich bin …]</h2>
      <p class="person-name">[Name Nachname]</p>
      <p class="person-rolle">[Rolle im Projekt]</p>
    </div>
    <!-- Portrait aufgelockert, kein Bewerbungsfoto-Look. -->
    <div class="personen-portrait reveal">[Portraitfoto]</div>
  </div>
</section>
