<style>
/* ==== Team-Grid ==== */
/* Kein echtes Foto nötig: .team-avatar zeigt ersatzweise Initialen auf Sand/200 —
   gleicher Hintergrund/Ausschnitt/Höhe wie von Figma gefordert, ohne Bildmaterial. */
/* WICHTIG: Platzhaltertext hier NIE "[NN]"/"[nn]" - das ersetzt tools/bauen.py
   global durch die echte Kapitelnummer (nummerieren()), auch ausserhalb der
   Eyebrow/id. Frueher stand hier "[NN]" und wurde dadurch zu z.B. "22" statt
   Initialen - gefunden per Figma-Abgleich, 2026-09-17. */
.team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--space-6)}
.team-member{display:flex;flex-direction:column;gap:16px}
.team-avatar{aspect-ratio:4/5;border-radius:var(--radius-card);background:var(--color-detail);
  display:flex;align-items:center;justify-content:center;font-size:var(--text-display-3);font-weight:600;color:var(--color-text)}
.team-member .name{font-weight:600;font-size:var(--text-body-ms)}
.team-member .role{font-size:var(--text-body-s);color:var(--color-text)}
</style>

<section data-chapter="[NN]" data-chapter-title="[Kapitelname]" id="kapitel-[nn]" data-modul="08 Menschen/01 team-grid">
  <div class="wrap">
    <p class="eyebrow reveal">[NN] — [Team]<span class="eyebrow-linie" aria-hidden="true"></span></p>
    <h2 class="h2 reveal" style="margin-bottom:var(--space-20)">[Wer arbeitet daran?]</h2>
    <div class="team-grid">
      <div class="team-member reveal"><div class="team-avatar">[Initialen]</div><p class="name">[Name Nachname]</p><p class="role">[Rolle im Projekt]</p></div>
      <div class="team-member reveal"><div class="team-avatar">[Initialen]</div><p class="name">[Name Nachname]</p><p class="role">[Rolle im Projekt]</p></div>
      <div class="team-member reveal"><div class="team-avatar">[Initialen]</div><p class="name">[Name Nachname]</p><p class="role">[Rolle im Projekt]</p></div>
      <div class="team-member reveal"><div class="team-avatar">[Initialen]</div><p class="name">[Name Nachname]</p><p class="role">[Rolle im Projekt]</p></div>
    </div>
  </div>
</section>
