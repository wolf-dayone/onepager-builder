<style>
/* ==== Karten-Karussell ==== */
.carousel{overflow-x:auto;scroll-snap-type:x mandatory;display:flex;gap:var(--space-6);
  padding-bottom:var(--space-6);scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
/* Linker Einzug ueber ein echtes Flex-Kind statt padding-left auf dem
   Scroll-Container: Browser setzen bei overflow-x:auto + Flex/Grid den
   initialen scrollLeft oft genau auf den Wert der Start-Padding, wodurch sie
   bei Ruheposition unsichtbar bleibt (die erste Karte sass dadurch trotz
   padding-left an Kante 0 statt eingerueckt). Ein echter Spacer-Block hat
   dieses Problem nicht. Breite = gewuenschter Einzug minus den ohnehin
   folgenden .carousel-gap, weil der Flex-gap zwischen Spacer und erster
   Karte den Rest beisteuert.
   Rechts: padding-right in derselben Groesse, damit der Track auf gleicher
   Kante wie die Button-Gruppe darunter endet (Ernst, Review Gruppe D) - das
   Modul haelt sich also doch an den regulaeren Modul-Rand statt bis zum
   nackten Viewport-Rand zu laufen; padding-right ist hier unproblematisch,
   der Snap-Ruheposition-Bug betrifft nur die START-Seite eines
   scroll-snap:mandatory-Containers, nicht das Ende. */
.carousel{padding-right:max(var(--grid-margin),
  calc((100% - var(--grid-max)) / 2 + var(--grid-margin)))}
.carousel-spacer{flex:0 0 auto;width:calc(max(var(--grid-margin),
  calc((100% - var(--grid-max)) / 2 + var(--grid-margin))) - var(--space-6));
  scroll-snap-align:start}
/* scroll-snap-align auf dem Spacer, nicht nur auf den Karten: bei
   scroll-snap-type:x MANDATORY zwingt der Browser die Ruheposition auf den
   naechsten gueltigen Snap-Punkt - ohne diese Zeile war Position 0 (Spacer)
   kein gueltiger Punkt, wodurch beim Laden sofort auf die erste Karte
   vorgesprungen wurde (scrollLeft startete bei 176 statt 0, der Einzug
   verschwand). Mit dieser Zeile ist die Ruheposition selbst gueltig. */
.carousel>.card{flex:0 0 400px;scroll-snap-align:start;min-height:500px;justify-content:space-between}
/* Im Karussell tragen die Karten Flaeche statt Rahmen (Figma: keine border in
   diesem Kontext, nur die Sand/200-Flaeche) - dort ist Abgrenzung ueber Farbe
   wichtiger als die Hairline-Kante der freistehenden Karte. Vorher stand hier
   nur border-top:0, das liess links/rechts/unten einen Rahmenrest stehen, der
   durch das overflow-x:auto der Scroll-Spalte oben abgeschnitten wirkte. */
.carousel>.card{background:var(--color-detail);border:0;border-radius:var(--radius-card);padding:var(--space-10);gap:0}
/* min-width:0 ist noetig, nicht optional: die Sektion ist ein Flex-Container,
   und ein Flex-Item bekommt sonst min-width:auto - die Shell würde dann so
   breit wie ihr Inhalt statt wie der Viewport, die ganze Seite scrollt seitlich. */
.carousel-shell{width:100%;min-width:0}
.carousel-controls{display:flex;gap:12px;justify-content:flex-end;margin-top:var(--space-6)}
.carousel-controls button{width:56px;height:56px;border-radius:var(--radius-pill);border:1px solid var(--gray-300);
  background:none;cursor:pointer;color:var(--color-main-text);font-family:inherit;
  display:flex;align-items:center;justify-content:center}
.carousel-controls button svg{width:24px;height:24px}
.carousel-controls button:hover{border-color:var(--color-main-text)}
.carousel-controls button:disabled{opacity:.3;cursor:default}
@media(max-width:700px){.carousel>.card{flex-basis:80vw}}
</style>

<!-- Generisches Modul für nummerierte Textinhalte, nicht nur für Abschluss-Takeaways.
     .carousel-shell begrenzt den Track auf --grid-max, damit die erste Karte am
     linken Grid-Rand startet statt am nackten Viewport-Rand. -->
<section data-chapter="[NN]" data-chapter-title="[Kapitelname]" id="kapitel-[nn]" style="padding-inline:0" data-modul="10 Abschluss/01 karten-karussell">
  <div class="wrap">
    <div class="section-head reveal">
      <div><p class="eyebrow">[NN] — [Kapitelname]</p><h2 class="h2">[Was wir euch mitgeben]</h2></div>
    </div>
  </div>
  <div class="carousel-shell">
    <div class="carousel" id="karten-karussell">
      <div class="carousel-spacer" aria-hidden="true"></div>
      <div class="card"><span class="num">01</span>
        <div class="card-copy"><h3 class="h3">[Merksatz]</h3><p class="body">[2–3 Sätze.]</p></div></div>
      <div class="card"><span class="num">02</span>
        <div class="card-copy"><h3 class="h3">[Merksatz]</h3><p class="body">[2–3 Sätze.]</p></div></div>
      <div class="card"><span class="num">03</span>
        <div class="card-copy"><h3 class="h3">[Merksatz]</h3><p class="body">[2–3 Sätze.]</p></div></div>
      <div class="card"><span class="num">04</span>
        <div class="card-copy"><h3 class="h3">[Merksatz]</h3><p class="body">[2–3 Sätze.]</p></div></div>
    </div>
  </div>
  <div class="wrap carousel-controls">
    <button type="button" data-carousel="karten-karussell" data-dir="-1" aria-label="Zurück">
      <svg aria-hidden="true"><use href="#icon-pfeil-links"></use></svg>
    </button>
    <button type="button" data-carousel="karten-karussell" data-dir="1" aria-label="Weiter">
      <svg aria-hidden="true"><use href="#icon-pfeil-rechts"></use></svg>
    </button>
  </div>
</section>
