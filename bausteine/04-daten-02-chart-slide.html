<style>
/* ==== Chart-Slide ==== */
/* Figma: Charts entstehen aus echten Daten, nicht als Bild. Deshalb ein
   einfaches Balkendiagramm aus divs - Hoehe ueber --wert (0..1) gesteuert.
   Modul nutzt die volle verfuegbare Sektionshoehe (Ernst, 2026-09-xx): .wrap
   und .chart-body wachsen per flex:1 bis an das Sektions-Padding heran,
   statt als kurzer, vertikal zentrierter Block auf viel Leerraum zu sitzen. */
.chart-slide .wrap{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.chart-body{margin-top:var(--space-8);display:flex;gap:var(--space-4);align-items:stretch;
  flex:1 1 auto;min-height:0}
.chart-y-achse{display:flex;flex-direction:column;justify-content:space-between;
  padding-bottom:28px;font-size:var(--text-body-s);color:var(--color-text);text-align:right}
.chart-slide .chart{flex:1;min-height:220px;display:flex;align-items:flex-end;
  gap:var(--space-6);padding-bottom:28px;position:relative}
/* Gitterlinien als echte Elemente statt background-image - dadurch koennen sie
   einzeln von links nach rechts einlaufen (Ernst: "lines can be animated in
   from left to right"), statt einfach dazustehen. Eigener Wrapper, exakt auf
   die Balken-Flaeche begrenzt (bottom:28px spart denselben Platz aus, den
   .chart per padding-bottom fuer die Monats-Labels reserviert) - sonst
   waeren die Prozent-Positionen der Linien gegen die falsche Box berechnet
   und liefen der tatsaechlichen Balkenhoehe (die auf der Content-Box von
   .chart basiert) leicht auseinander. */
.chart-gitter{position:absolute;left:0;right:0;top:0;bottom:28px;pointer-events:none}
.chart-gitter span{position:absolute;left:0;right:0;height:1px;background:var(--color-border);
  transform:scaleX(0);transform-origin:left;transition:transform 1s var(--ease-linie)}
.chart-gitter span:nth-child(1){bottom:0}
.chart-gitter span:nth-child(2){bottom:25%}
.chart-gitter span:nth-child(3){bottom:50%}
.chart-gitter span:nth-child(4){bottom:75%}
.chart-gitter span:nth-child(5){bottom:100%}
.chart-body.in .chart-gitter span{transform:scaleX(1)}
.chart-balken{flex:1;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:center;height:100%;position:relative}
/* --wert startet bei 0 (Fallback im calc()) - erst growChart() in _basis.js setzt
   den echten Wert per style.setProperty, sobald das leere Diagramm fertig
   eingeblendet ist. Dadurch "waechst" die Saeule wirklich, statt schon fertig
   dazustehen, wenn die Sektion in den Viewport kommt. */
/* Farben aus den Figma-Icon-Rollen: icon/tertiary ruhend, icon/secondary im
   Hover (2026-09-17). Vorher griff das Modul zu --color-border (eine
   Linienrolle) und --color-main-text (eine Textrolle) - optisch aehnlich,
   semantisch aber die falsche Ebene, und im Dunkelmodus dadurch zu hart. */
.chart-balken .saeule{width:100%;border-radius:4px 4px 0 0;background:var(--color-icon-tertiary);
  height:calc(var(--wert,0) * 100%);
  transition:height var(--dur-linie) var(--ease-linie),background var(--dur-ui) var(--ease-ui);
  position:relative}
/* .ist-betont simuliert (per JS, einmalig nach dem Einwachsen) genau den
   Zustand, den echtes Hover/Tap ohnehin ausloest - siehe :hover/:focus-visible
   unten. KEIN Dauerzustand mehr: Figma zeigt eine Saeule dunkel als Beispiel
   dafuer, wie Hover/Tap aussehen, nicht als fixen Teil des Rulesets (Ernst,
   2026-09-xx: "the darker column is supposed to be a simulation of a hovered
   or tapped state, so not the initial view"). */
.chart-balken.ist-betont .saeule,.chart-balken:hover .saeule,.chart-balken:focus-visible .saeule{
  background:var(--color-icon-secondary)}
/* Der Wert steht 8px UEBER der Saeule (Figma-Mass) und erscheint erst, wenn
   die Saeule zu wachsen beginnt - vorher klebte eine Reihe fertiger Zahlen
   ueber einem leeren Diagramm und nahm dem Wachsen die Pointe (2026-09-17).
   .ist-gewachsen setzt growChart() in _basis.js zusammen mit --wert. */
/* bottom:100% = Oberkante der Saeule, +8px Abstand darueber. Vorher stand hier
   calc(var(--wert) * 100% + 8px) - der Prozentwert loeste aber gegen die
   SAEULE auf (dort haengt das Element), nicht gegen die volle Balkenhoehe,
   wodurch die Zahl im Balken landete statt darueber. Ueber bottom:100% wandert
   sie automatisch mit, waehrend die Saeule waechst - ganz ohne --wert. */
.chart-wert{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(100% + 8px);
  font-size:var(--text-body-s);color:var(--color-text);opacity:0;
  transition:color var(--dur-ui) var(--ease-ui),
             opacity .45s var(--ease-reveal) .2s}
.chart-balken.ist-gewachsen .chart-wert{opacity:1}
.chart-balken.ist-betont .chart-wert,.chart-balken:hover .chart-wert,.chart-balken:focus-visible .chart-wert{
  color:var(--color-main-text);font-weight:600}
.chart-balken .achse{position:absolute;bottom:-28px;left:0;right:0;text-align:center;
  font-size:var(--text-body-s);color:var(--color-text);line-height:1.2;transition:color .25s var(--ease),font-weight .25s var(--ease)}
.chart-balken.ist-betont .achse,.chart-balken:hover .achse,.chart-balken:focus-visible .achse{
  color:var(--color-main-text);font-weight:600}
.chart-quelle{margin-top:var(--space-4);font-size:var(--text-body-s);color:var(--color-text);
  opacity:.7}
@media(prefers-reduced-motion:reduce){
  .chart-balken .saeule,.chart-wert{transition:none}
  .chart-gitter span{transition:none}
  .chart-balken .chart-wert{opacity:1}
}
@media(max-width:900px){.chart-slide .chart{min-height:180px;gap:var(--space-4)}}
</style>

<!-- Ein Chart pro Modul. Titel sagt die Erkenntnis, nicht die Datenart. -->
<section class="chart-slide" data-chapter="[NN]" data-chapter-title="[Kapitelname]" id="kapitel-[nn]" data-modul="04 Daten/02 chart-slide">
  <div class="wrap">
    <p class="eyebrow reveal">[NN] — [Daten]<span class="eyebrow-linie" aria-hidden="true"></span></p>
    <div class="reveal">
      <h2 class="h2">[Nutzung verdoppelt sich ab März]</h2>
      <p class="small" style="margin-top:6px;color:var(--color-text)">[Kurze Einordnung, was das Chart zeigt.]</p>
    </div>
    <div class="chart-body reveal" role="img" aria-label="[Beschreibung des Diagramms für Screenreader]">
      <div class="chart-y-achse" aria-hidden="true"><span>100</span><span>75</span><span>50</span><span>25</span><span>0</span></div>
      <div class="chart">
        <div class="chart-gitter" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
        <div class="chart-balken" data-wert=".45"><div class="saeule"><span class="chart-wert" data-count-to="45">0</span></div><span class="achse">[Jan]</span></div>
        <div class="chart-balken" data-wert=".62"><div class="saeule"><span class="chart-wert" data-count-to="62">0</span></div><span class="achse">[Feb]</span></div>
        <div class="chart-balken" data-wert=".38"><div class="saeule"><span class="chart-wert" data-count-to="38">0</span></div><span class="achse">[Mär]</span></div>
        <div class="chart-balken" data-wert=".78"><div class="saeule"><span class="chart-wert" data-count-to="78">0</span></div><span class="achse">[Apr]</span></div>
        <div class="chart-balken" data-wert=".91" data-demo-hover="true"><div class="saeule"><span class="chart-wert" data-count-to="91">0</span></div><span class="achse">[Mai]</span></div>
        <div class="chart-balken" data-wert=".85"><div class="saeule"><span class="chart-wert" data-count-to="85">0</span></div><span class="achse">[Jun]</span></div>
        <div class="chart-balken" data-wert=".56"><div class="saeule"><span class="chart-wert" data-count-to="56">0</span></div><span class="achse">[Jul]</span></div>
      </div>
    </div>
    <p class="chart-quelle reveal">Quelle: [Datenquelle], [Zeitraum]</p>
  </div>
</section>
