<style>
/* ==== Chart-Slide ==== */
/* Figma: Charts entstehen aus echten Daten, nicht als Bild. Deshalb ein
   einfaches Balkendiagramm aus divs - Hoehe ueber --wert (0..1) gesteuert.
   Die hervorgehobene Serie traegt .ist-betont (dunkel, wie Figma - KEIN
   Blue-Highlight; frueher stand hier faelschlich var(--blue-3), gefunden
   beim Figma-Abgleich 2026-09-17). Bars stehen direkt auf der Seite, ohne
   Kartenhintergrund - Figma zeigt kein umschliessendes Feld ums Chart. */
.chart-body{margin-top:var(--space-8);display:flex;gap:var(--space-4);align-items:stretch}
.chart-y-achse{display:flex;flex-direction:column;justify-content:space-between;
  padding-bottom:28px;font-size:var(--text-body-s);color:var(--color-text);text-align:right}
.chart-slide .chart{flex:1;height:300px;display:flex;align-items:flex-end;
  gap:var(--space-6);padding-bottom:28px;position:relative;
  /* Gitterlinien alle 25% der Hoehe - ersetzt die frueher fehlenden
     Hilfslinien, die Figma neben der Achsenskala zeigt. */
  background-image:repeating-linear-gradient(to top,var(--color-border) 0,
    var(--color-border) 1px,transparent 1px,transparent 25%)}
.chart-balken{flex:1;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:center;height:100%;position:relative}
.chart-balken .saeule{width:100%;border-radius:4px 4px 0 0;background:var(--color-border);
  height:calc(var(--wert) * 100%);transition:height .8s var(--ease);position:relative}
.chart-balken.ist-betont .saeule{background:var(--color-main-text)}
.chart-wert{position:absolute;top:8px;left:50%;transform:translateX(-50%);
  font-size:var(--text-body-s);font-weight:600;color:var(--color-bg)}
.chart-balken .achse{position:absolute;bottom:-28px;left:0;right:0;text-align:center;
  font-size:var(--text-body-s);color:var(--color-text);line-height:1.2}
.chart-quelle{margin-top:var(--space-4);font-size:var(--text-body-s);color:var(--color-text);
  opacity:.7}
@media(prefers-reduced-motion:reduce){.chart-balken .saeule{transition:none}}
@media(max-width:900px){.chart-slide .chart{height:220px;gap:var(--space-4)}}
</style>

<!-- Ein Chart pro Modul. Titel sagt die Erkenntnis, nicht die Datenart. -->
<section class="chart-slide" data-chapter="[NN]" data-chapter-title="[Kapitelname]" id="kapitel-[nn]" data-modul="04 Daten/02 chart-slide">
  <div class="wrap">
    <p class="eyebrow">[NN] — [Daten]</p>
    <h2 class="h2 reveal">[Nutzung verdoppelt sich ab März]</h2>
    <p class="small" style="margin-top:6px;color:var(--color-text)">[Kurze Einordnung, was das Chart zeigt.]</p>
    <div class="chart-body reveal" role="img" aria-label="[Beschreibung des Diagramms für Screenreader]">
      <div class="chart-y-achse" aria-hidden="true"><span>100</span><span>75</span><span>50</span><span>25</span><span>0</span></div>
      <div class="chart">
        <div class="chart-balken" style="--wert:.35"><div class="saeule"></div><span class="achse">[Jan]</span></div>
        <div class="chart-balken" style="--wert:.42"><div class="saeule"></div><span class="achse">[Feb]</span></div>
        <div class="chart-balken" style="--wert:.86"><div class="saeule"></div><span class="achse">[Mär]</span></div>
        <div class="chart-balken" style="--wert:.79"><div class="saeule"></div><span class="achse">[Apr]</span></div>
        <div class="chart-balken ist-betont" style="--wert:.91"><div class="saeule"><span class="chart-wert">91</span></div><span class="achse">[Mai]</span></div>
      </div>
    </div>
    <p class="chart-quelle">Quelle: [Datenquelle], [Zeitraum]</p>
  </div>
</section>
