<style>
/* ==== Hero ==== */
/* Hintergrund (.dark, falls gesetzt) sitzt auf dem ungebremsten <header>, Inhalt in
   .wrap darunter — sonst entstehen auf sehr breiten Screens helle Ränder links/rechts
   (wrap+dark auf demselben Element begrenzt auch den Hintergrund auf --grid-max). */
.hero{min-height:100svh;scroll-snap-align:start}
.hero .wrap{min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;
  padding-block:var(--space-16) var(--space-20)}
.hero .top{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4)}
.logo-mark{display:block;color:var(--color-main-text)}
.hero .badges{display:flex;gap:12px}
.badge{border:1px solid var(--color-border);border-radius:var(--radius-pill);padding:10px 20px;
  font-size:var(--text-body-s);font-weight:400;letter-spacing:.06em;color:var(--color-main-text);text-decoration:none}
.badge.accent{border-color:var(--red-500);color:var(--red-500)}
.hero h1 .line2{display:block;font-weight:400;color:var(--color-text)}
.hero .sub{margin-top:var(--space-6);max-width:46ch}
.hero .rule{height:1px;width:min(640px,100%);margin-bottom:var(--space-8);
  /* Figma nennt diese Graustufe "Gray/400", ihr Wert entspricht aber unserem
     --gray-300 — die Nummerierung zwischen Figma-Variablen und diesen Tokens ist NICHT
     deckungsgleich. Beim Übersetzen von Figma-Werten immer den Hex-Wert vergleichen,
     nicht den Variablennamen übernehmen. */
  background:linear-gradient(90deg,var(--gray-300) 0%,var(--color-bg) 100%)}
.hero .meta{display:flex;flex-wrap:wrap;gap:var(--space-16)}
.hero .meta dt{font-size:var(--text-body-s);letter-spacing:.08em;text-transform:uppercase;color:var(--color-text)}
.hero .meta dd{margin:8px 0 0;font-weight:600}
</style>

<!-- Farbmodus (dark oder nicht) wird von tools/bauen.py beim Zusammenbau der
     Seite je nach Kapitel-Position gesetzt, nicht hier fest einprogrammiert. -->
<header class="hero" id="hero" data-modul="01 Einstieg/01 cover-hero">
  <div class="wrap">
    <div class="top reveal">
      <svg class="logo-mark" width="150" height="27" aria-label="DAYONE"><use href="#dayone-logo"></use></svg>
      <!-- Figma zeigt im Standardzustand genau EIN Badge (Component-Description:
           "Badges sind optional - bei Kundenpitches meist nur einer oder
           keiner."), frueher standen hier faelschlich zwei gleichzeitig
           (Figma-Abgleich, 2026-09-17). Zweites Badge-Beispiel (die
           DAYONE-Weekly-Live-Q&A-Variante) bleibt als auskommentierte
           Alternative erhalten - nur einsetzen, wenn es wirklich ein Weekly
           mit Live-Q&A-Link ist, sonst bei diesem einen Badge bleiben oder
           den ganzen <div class="badges"> entfernen. -->
      <div class="badges">
        <span class="badge">[Badge Title]</span>
        <!-- Alternative fuer DAYONE Weeklies mit Live-Q&A:
        <a class="badge accent" href="[LIVE-LINK]">LIVE Q&amp;A</a>
        -->
      </div>
    </div>
    <div class="reveal">
      <h1 class="h1">[PROJEKTNAME]<span class="line2">[UNTERTITEL DER SESSION]</span></h1>
      <p class="lead sub">[Ein bis zwei Zeilen, die erklären, worum es geht und warum es jetzt relevant ist.]</p>
    </div>
    <div class="reveal">
      <div class="rule"></div>
      <dl class="meta">
        <div><dt>Datum</dt><dd>[Montag, 1. Januar 2026]</dd></div>
        <div><dt>Presenter</dt><dd>[Vorname &amp; Vorname]</dd></div>
        <div><dt>Format</dt><dd>[DAYONE Weekly]</dd></div>
      </dl>
    </div>
  </div>
</header>
